<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leaflet 雨雲レーダー</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, "Yu Gothic", Meiryo, sans-serif;
}

.map-controls {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    width: 270px;
    background: rgba(255,255,255,.94);
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    padding: 10px;
    box-sizing: border-box;
}

.control-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

button {
    height: 34px;
    flex: 1;
    border: 1px solid #aaa;
    border-radius: 5px;
    background: white;
    padding: 3px 8px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #f2f2f2;
}

#timeSlider {
    width: 100%;
    margin: 5px 0 0;
}

.time-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #333;
}

#timeText {
    text-align: center;
    font-weight: bold;
    margin-top: 4px;
    font-size: 13px;
}

.status {
    font-size: 11px;
    color: #555;
    margin-top: 5px;
    line-height: 1.4;
}

@media (max-width: 600px) {
    .map-controls {
        width: calc(100vw - 20px);
        max-width: 340px;
    }

    button {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="map-controls">
    <div class="control-row">
        <button id="locationBtn">◎ 現在地</button>
        <button id="japanBtn">全国表示</button>
    </div>

    <input id="timeSlider" type="range">

    <div class="time-label">
        <span id="pastLabel">過去2時間</span>
        <span>現在</span>
    </div>

    <div id="timeText">現在</div>

    <div class="status" id="status">RainViewer</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/*
=========================================================
Leaflet 雨雲レーダー
RainViewerの「過去2時間」データのみを使用。
=========================================================
*/

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true,
    minZoom: 2
}).setView([36.5, 138.0], 5);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
    }
).addTo(map);


/*
=========================================================
RainViewer
=========================================================
*/

let rainViewerFrames = [];
let rainViewerHost = "";
let rainLayer = null;

const slider = document.getElementById("timeSlider");
const timeText = document.getElementById("timeText");


async function loadRainViewer() {

    try {

        const response = await fetch(
            "https://api.rainviewer.com/public/weather-maps.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        if (!data.host) {
            throw new Error("RainViewer hostが取得できません");
        }

        if (!data.radar || !data.radar.past) {
            throw new Error("RainViewer radar.pastが取得できません");
        }

        rainViewerHost = data.host;
        rainViewerFrames = data.radar.past.slice();

        if (!rainViewerFrames.length) {
            throw new Error("RainViewerのフレームがありません");
        }

        rainViewerFrames.sort(
            (a, b) => a.time - b.time
        );

        /*
         * 最新フレームを「現在」とする。
         * 未来フレームは使用しない。
         */
        const latest =
            rainViewerFrames[
                rainViewerFrames.length - 1
            ].time;

        const oldest =
            rainViewerFrames[0].time;

        const minOffset =
            Math.round(
                (oldest - latest) / 60
            );

        slider.min = minOffset;
        slider.max = 0;
        slider.step = 10;
        slider.value = 0;

        document.getElementById("pastLabel").textContent =
            Math.round(Math.abs(minOffset) / 60) + "時間前";

        updateRainLayer();

    } catch (error) {

        console.error(
            "RainViewer:",
            error
        );

        document.getElementById("status").textContent =
            "RainViewerのデータ取得に失敗しました。";

    }
}


function updateRainLayer() {

    if (!rainViewerFrames.length) {
        return;
    }

    const latest =
        rainViewerFrames[
            rainViewerFrames.length - 1
        ].time;

    const target =
        latest +
        Number(slider.value) * 60;

    let selected =
        rainViewerFrames[0];

    let minDiff =
        Infinity;

    rainViewerFrames.forEach(function(frame) {

        const diff =
            Math.abs(frame.time - target);

        if (diff < minDiff) {

            minDiff = diff;
            selected = frame;
        }
    });

    if (rainLayer) {
        map.removeLayer(rainLayer);
    }

    /*
     * RainViewer公式の host + path 方式。
     * RainViewerの現在の公開API仕様に合わせる。
     */
    const url =
        rainViewerHost +
        selected.path +
        "/256/{z}/{x}/{y}/2/1_1.png";

    rainLayer =
        L.tileLayer(url, {
            opacity: 0.65,
            tileSize: 256,

            /*
             * RainViewer側のネイティブ最大ズームは7。
             * maxNativeZoom=7のタイルを、Leafletでは19まで
             * 拡大表示できるようにする。
             */
            maxNativeZoom: 7,
            maxZoom: 19,

            attribution:
                '<a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
        }).addTo(map);

    const date =
        new Date(selected.time * 1000);

    const offset =
        Math.round(
            (selected.time - latest) / 60
        );

    let text =
        date.toLocaleString(
            "ja-JP",
            {
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    if (offset === 0) {

        text += "（現在）";

    } else {

        text +=
            "（" + offset + "分）";
    }

    timeText.textContent = text;
}


slider.addEventListener(
    "input",
    function() {
        updateRainLayer();
    }
);


/*
=========================================================
現在地
=========================================================
*/

document.getElementById("locationBtn")
    .addEventListener(
        "click",
        function() {

            const button = this;

            if (!navigator.geolocation) {

                alert(
                    "このブラウザでは現在地取得に対応していません。"
                );

                return;
            }

            button.textContent = "取得中...";

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;

                    map.setView(
                        [lat, lon],
                        10,
                        {
                            animate: true
                        }
                    );

                    /*
                     * マーカーだけ表示。
                     * 吹き出しは表示しない。
                     */
                    L.marker([lat, lon])
                        .addTo(map);

                    button.textContent =
                        "◎ 現在地";
                },

                function(error) {

                    console.error(error);

                    alert(
                        "現在地を取得できませんでした。\n" +
                        "ブラウザの位置情報許可を確認してください。"
                    );

                    button.textContent =
                        "◎ 現在地";
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }
    );


/*
=========================================================
全国表示
=========================================================
*/

document.getElementById("japanBtn")
    .addEventListener(
        "click",
        function() {

            map.setView(
                [36.5, 138.0],
                5,
                {
                    animate: true
                }
            );
        }
    );


/*
=========================================================
初期処理
=========================================================
*/

loadRainViewer();

</script>
</body>
</html>
