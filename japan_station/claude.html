<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国鉄道駅マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
	html, body {
		margin: 0;
		padding: 0;
		height: 100%;
		width: 100%;
		font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
	}
	#map {
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
	}

	/* ---- 左上：現在地／全国表示ボタン ---- */
	.custom-ctrl-box {
		background: none;
		border: none;
	}
	.custom-btn {
		background: #fff;
		width: 34px;
		height: 34px;
		display: flex;
		align-items: center;
		justify-content: center;
		box-shadow: 0 1px 5px rgba(0,0,0,0.4);
		border-radius: 4px;
		cursor: pointer;
		margin-top: 8px;
		font-size: 18px;
		user-select: none;
		transition: background 0.15s;
	}
	.custom-btn:hover {
		background: #f0f0f0;
	}
	.custom-btn:active {
		background: #dcdcdc;
	}
	.custom-btn svg {
		width: 18px;
		height: 18px;
		fill: #333;
	}

	/* ---- 右上：検索 ---- */
	.search-box {
		background: #fff;
		border-radius: 4px;
		box-shadow: 0 1px 5px rgba(0,0,0,0.4);
		padding: 6px;
		width: 220px;
		box-sizing: border-box;
	}
	.search-box input[type="text"] {
		width: 100%;
		box-sizing: border-box;
		padding: 6px 8px;
		font-size: 13px;
		border: 1px solid #ccc;
		border-radius: 3px;
		outline: none;
	}
	.search-box input[type="text"]:focus {
		border-color: #4a90d9;
	}
	.search-results {
		max-height: 260px;
		overflow-y: auto;
		margin-top: 4px;
		border-top: 1px solid #eee;
	}
	.search-results:empty {
		border-top: none;
		margin-top: 0;
	}
	.search-item {
		padding: 6px 6px;
		font-size: 12px;
		cursor: pointer;
		border-bottom: 1px solid #f2f2f2;
		line-height: 1.4;
	}
	.search-item:last-child {
		border-bottom: none;
	}
	.search-item:hover {
		background: #f0f6ff;
	}
	.search-item .s-name {
		font-weight: bold;
		color: #222;
	}
	.search-item .s-sub {
		color: #777;
		font-size: 11px;
	}
	.search-empty {
		padding: 6px;
		font-size: 12px;
		color: #999;
	}

	/* ---- 右上：フィルタ ---- */
	.filter-box {
		background: #fff;
		border-radius: 4px;
		box-shadow: 0 1px 5px rgba(0,0,0,0.4);
		padding: 8px 10px;
		margin-top: 8px;
		font-size: 12px;
	}
	.filter-box .filter-title {
		font-weight: bold;
		font-size: 12px;
		margin-bottom: 4px;
		color: #333;
	}
	.filter-box label {
		display: flex;
		align-items: center;
		gap: 6px;
		padding: 3px 0;
		cursor: pointer;
		white-space: nowrap;
	}
	.filter-box input[type="radio"] {
		margin: 0;
		cursor: pointer;
	}
	.color-dot {
		display: inline-block;
		width: 10px;
		height: 10px;
		border-radius: 50%;
		flex: none;
		border: 1px solid rgba(0,0,0,0.25);
	}

	/* ---- ポップアップ ---- */
	.leaflet-popup-content-wrapper {
		border-radius: 6px;
	}
	.leaflet-popup-content {
		margin: 8px 10px;
		font-size: 12px;
		line-height: 1.5;
	}
	.popup-station-name {
		font-weight: bold;
		font-size: 14px;
		margin-bottom: 3px;
		color: #111;
	}
	.popup-lines {
		max-height: 140px;
		overflow-y: auto;
	}
	.popup-line-row {
		padding: 1px 0;
		white-space: nowrap;
	}
	.popup-line-row .company {
		color: #555;
	}
	.popup-line-row .line {
		color: #111;
	}

	/* ---- 現在地マーカー ---- */
	.current-loc-dot {
		width: 14px;
		height: 14px;
		border-radius: 50%;
		background: #1a73e8;
		border: 2px solid #fff;
		box-shadow: 0 0 0 2px rgba(26,115,232,0.5);
	}
</style>
</head>

<script>
(function () {
	"use strict";

	/* ===================== 基本設定 ===================== */

	var CATS = {
		JR:      { label: "JR",           color: "#e5342a" },
		PRIVATE: { label: "私鉄",          color: "#1e7fe0" },
		SUBWAY:  { label: "地下鉄・公営",   color: "#2fa84f" },
		OTHER:   { label: "その他・地方鉄道", color: "#f28c1e" }
	};
	var MIXED_COLOR = "#8e3fc9";

	var JAPAN_BOUNDS = [
		[24.0, 122.5],
		[46.0, 146.5]
	];

	var map = L.map("map", {
		preferCanvas: true,
		zoomControl: true,
		center: [37.0, 138.0],
		zoom: 6,
		minZoom: 4,
		maxZoom: 18
	});

	L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
		maxZoom: 19,
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	map.fitBounds(JAPAN_BOUNDS);

	var canvasRenderer = L.canvas({ padding: 0.5 });

	/* ===================== 駅マーカー生成 ===================== */

	function radiusForZoom(z) {
		if (z <= 6) return 2;
		if (z <= 8) return 2.6;
		if (z <= 9) return 3.2;
		if (z <= 10) return 4;
		if (z <= 11) return 4.8;
		if (z <= 12) return 5.6;
		if (z <= 13) return 6.6;
		if (z <= 14) return 7.6;
		if (z <= 15) return 8.8;
		return 10;
	}

	function colorForCats(cats) {
		if (cats.length === 1 && CATS[cats[0]]) {
			return CATS[cats[0]].color;
		}
		return MIXED_COLOR;
	}

	function buildPopupHtml(st) {
		var html = '<div class="popup-station-name">' + escapeHtml(st.n) + '</div>';
		html += '<div class="popup-lines">';
		for (var i = 0; i < st.l.length; i++) {
			var lineName = st.l[i][0];
			var companyName = st.l[i][1];
			html += '<div class="popup-line-row"><span class="company">' + escapeHtml(companyName) + '</span> <span class="line">' + escapeHtml(lineName) + '</span></div>';
		}
		html += '</div>';
		return html;
	}

	function escapeHtml(s) {
		return String(s)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;");
	}

	var allMarkers = [];   // { marker, cats, name, lat, lon }
	var searchIndex = [];  // { name, sub, marker }

	var initialRadius = radiusForZoom(map.getZoom());

	for (var i = 0; i < STATIONS.length; i++) {
		var st = STATIONS[i];
		var color = colorForCats(st.c);

		var marker = L.circleMarker([st.lat, st.lon], {
			renderer: canvasRenderer,
			radius: initialRadius,
			color: "#ffffff",
			weight: 1,
			opacity: 1,
			fillColor: color,
			fillOpacity: 0.9
		});

		marker.bindPopup(buildPopupHtml(st), { maxWidth: 240, maxHeight: 200 });
		marker.addTo(map);

		var rec = { marker: marker, cats: st.c, name: st.n, lat: st.lat, lon: st.lon };
		allMarkers.push(rec);

		var subLabel = st.l[0][1] + " " + st.l[0][0] + (st.l.length > 1 ? " ほか" + (st.l.length - 1) + "路線" : "");
		searchIndex.push({ name: st.n, sub: subLabel, rec: rec });
	}

	/* ===================== ズームで大きさを変える ===================== */

	map.on("zoomend", function () {
		var r = radiusForZoom(map.getZoom());
		for (var i = 0; i < allMarkers.length; i++) {
			allMarkers[i].marker.setRadius(r);
		}
	});

	/* ===================== フィルタ（ラジオボタン） ===================== */

	var FilterControl = L.Control.extend({
		options: { position: "topright" },
		onAdd: function () {
			var div = L.DomUtil.create("div", "filter-box");
			L.DomEvent.disableClickPropagation(div);
			L.DomEvent.disableScrollPropagation(div);

			var title = L.DomUtil.create("div", "filter-title", div);
			title.textContent = "路線種別フィルタ";

			var options = [
				{ value: "ALL", label: "すべて", color: null },
				{ value: "JR", label: "JR", color: CATS.JR.color },
				{ value: "PRIVATE", label: "私鉄", color: CATS.PRIVATE.color },
				{ value: "SUBWAY", label: "地下鉄・公営", color: CATS.SUBWAY.color },
				{ value: "OTHER", label: "その他・地方鉄道", color: CATS.OTHER.color }
			];

			options.forEach(function (opt, idx) {
				var label = L.DomUtil.create("label", "", div);
				var input = L.DomUtil.create("input", "", label);
				input.type = "radio";
				input.name = "line-filter";
				input.value = opt.value;
				if (idx === 0) input.checked = true;

				if (opt.color) {
					var dot = L.DomUtil.create("span", "color-dot", label);
					dot.style.background = opt.color;
				} else {
					var dot2 = L.DomUtil.create("span", "color-dot", label);
					dot2.style.background = "linear-gradient(135deg, " + CATS.JR.color + ", " + CATS.PRIVATE.color + " 50%, " + CATS.SUBWAY.color + ")";
				}

				var span = L.DomUtil.create("span", "", label);
				span.textContent = opt.label;

				L.DomEvent.on(input, "change", function () {
					applyFilter(opt.value);
				});
			});

			return div;
		}
	});
	map.addControl(new FilterControl());

	function applyFilter(value) {
		for (var i = 0; i < allMarkers.length; i++) {
			var rec = allMarkers[i];
			var match = (value === "ALL") || (rec.cats.indexOf(value) !== -1);

			if (match) {
				if (!map.hasLayer(rec.marker)) {
					rec.marker.addTo(map);
				}
				var color = (value === "ALL") ? colorForCats(rec.cats) : CATS[value].color;
				rec.marker.setStyle({ fillColor: color });
			} else {
				if (map.hasLayer(rec.marker)) {
					map.removeLayer(rec.marker);
				}
			}
		}
	}

	/* ===================== 駅名検索 ===================== */

	var SearchControl = L.Control.extend({
		options: { position: "topright" },
		onAdd: function () {
			var div = L.DomUtil.create("div", "search-box");
			L.DomEvent.disableClickPropagation(div);
			L.DomEvent.disableScrollPropagation(div);

			var input = L.DomUtil.create("input", "", div);
			input.type = "text";
			input.placeholder = "駅名で検索";

			var results = L.DomUtil.create("div", "search-results", div);

			L.DomEvent.on(input, "input", function () {
				var q = input.value.trim();
				results.innerHTML = "";
				if (q.length === 0) return;

				var matches = [];
				for (var i = 0; i < searchIndex.length && matches.length < 30; i++) {
					if (searchIndex[i].name.indexOf(q) !== -1) {
						matches.push(searchIndex[i]);
					}
				}

				if (matches.length === 0) {
					var empty = L.DomUtil.create("div", "search-empty", results);
					empty.textContent = "見つかりません";
					return;
				}

				matches.forEach(function (m) {
					var item = L.DomUtil.create("div", "search-item", results);
					var nameEl = L.DomUtil.create("div", "s-name", item);
					nameEl.textContent = m.name;
					var subEl = L.DomUtil.create("div", "s-sub", item);
					subEl.textContent = m.sub;

					L.DomEvent.on(item, "click", function () {
						map.flyTo([m.rec.lat, m.rec.lon], 16);
						setTimeout(function () {
							m.rec.marker.openPopup();
						}, 400);
						results.innerHTML = "";
						input.value = m.name;
					});
				});
			});

			return div;
		}
	});
	map.addControl(new SearchControl());

	/* ===================== 左上：現在地／全国表示ボタン ===================== */

	var currentLocMarker = null;

	var LeftButtonsControl = L.Control.extend({
		options: { position: "topleft" },
		onAdd: function () {
			var div = L.DomUtil.create("div", "custom-ctrl-box");
			L.DomEvent.disableClickPropagation(div);

			var locBtn = L.DomUtil.create("div", "custom-btn", div);
			locBtn.title = "現在地へ移動";
			locBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9-.94A9.01 9.01 0 0013.94 0v2.06A7 7 0 0121.94 10H24v2h-2.06A9.01 9.01 0 0114 20.94V23h-2v-2.06A9.01 9.01 0 013 12.94V15H0.94A9.01 9.01 0 0110 3.06V1h2v2.06A7 7 0 0119.94 10H22V8h-1z"/></svg>';

			L.DomEvent.on(locBtn, "click", function () {
				if (!navigator.geolocation) {
					alert("この端末では現在地を取得できません。");
					return;
				}
				locBtn.style.opacity = "0.5";
				navigator.geolocation.getCurrentPosition(function (pos) {
					locBtn.style.opacity = "1";
					var lat = pos.coords.latitude;
					var lon = pos.coords.longitude;

					if (currentLocMarker) {
						map.removeLayer(currentLocMarker);
					}
					currentLocMarker = L.marker([lat, lon], {
						icon: L.divIcon({
							className: "",
							html: '<div class="current-loc-dot"></div>',
							iconSize: [14, 14],
							iconAnchor: [7, 7]
						})
					}).addTo(map);

					map.flyTo([lat, lon], 15);
				}, function () {
					locBtn.style.opacity = "1";
					alert("現在地を取得できませんでした。位置情報の利用を許可してください。");
				}, { enableHighAccuracy: true, timeout: 10000 });
			});

			var japanBtn = L.DomUtil.create("div", "custom-btn", div);
			japanBtn.title = "全国表示";
			japanBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.93 6H15.7a15.9 15.9 0 00-1.44-3.8A8.03 8.03 0 0118.93 8zM12 4.04c.83 1.2 1.5 2.53 1.94 3.96h-3.88c.44-1.43 1.11-2.76 1.94-3.96zM4.26 14a7.9 7.9 0 010-4h3.68a16.6 16.6 0 000 4H4.26zm.81 2h3.23c.34 1.36.86 2.64 1.44 3.8A8.03 8.03 0 015.07 16zm3.23-8H5.07a8.03 8.03 0 014.6-3.8A15.9 15.9 0 008.3 8zM12 19.96a15.7 15.7 0 01-1.94-3.96h3.88A15.7 15.7 0 0112 19.96zM10.06 14a14.6 14.6 0 010-4h3.88a14.6 14.6 0 010 4h-3.88zm4.2 5.8c.58-1.16 1.1-2.44 1.44-3.8h3.23a8.03 8.03 0 01-4.67 3.8zM15.74 14a16.6 16.6 0 000-4h3.68a7.9 7.9 0 010 4h-3.68z"/></svg>';

			L.DomEvent.on(japanBtn, "click", function () {
				map.flyToBounds(JAPAN_BOUNDS);
			});

			return div;
		}
	});
	map.addControl(new LeftButtonsControl());

})();
</script>
</body>
</html>
