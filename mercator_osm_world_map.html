<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>メルカトル図法 × OpenStreetMap 世界地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,"Noto Sans JP",sans-serif}
#title{position:absolute;z-index:1000;top:12px;left:50px;background:rgba(255,255,255,.93);padding:8px 13px;border-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.25);font-size:16px;font-weight:bold}
#searchBox{position:absolute;z-index:1000;top:12px;right:12px;width:300px;display:flex;gap:5px}
#searchInput{flex:1;min-width:0;padding:8px 10px;border:1px solid #aaa;border-radius:4px;font-size:14px;background:rgba(255,255,255,.96)}
#searchButton{padding:8px 12px;border:1px solid #777;border-radius:4px;background:white;cursor:pointer}
#searchButton:hover{background:#eee}
#status{position:absolute;z-index:1000;right:12px;top:53px;width:300px;box-sizing:border-box;padding:7px 9px;background:rgba(255,255,255,.92);border-radius:4px;display:none;font-size:12px;line-height:1.4}
#info{position:absolute;z-index:1000;left:10px;bottom:10px;background:rgba(255,255,255,.9);padding:6px 9px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:12px}
</style></head>
<body>
<div id="map"></div><div id="title">メルカトル図法 × OpenStreetMap</div>
<div id="searchBox">
<input id="searchInput" type="text" placeholder="都市・国・地域を検索">
<button id="searchButton">検索</button>
</div>
<div id="status"></div>
<div id="info">標準メルカトル図法（Web Mercator）。ドラッグ・ホイール・ピンチで操作できる。</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{center:[20,0],zoom:2,worldCopyJump:true,minZoom:1,maxZoom:19,zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const searchMarker = L.marker([0,0], {opacity:0});

function showStatus(s){
 const el=document.getElementById('status');
 el.textContent=s;
 el.style.display='block';
}
async function searchPlace(){
 const q=document.getElementById('searchInput').value.trim();
 if(!q)return;
 showStatus('検索中…');
 try{
   const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q='+encodeURIComponent(q);
   const response=await fetch(url,{headers:{'Accept':'application/json'}});
   if(!response.ok)throw new Error('検索に失敗しました');
   const results=await response.json();
   if(!results.length){showStatus('該当する場所が見つかりませんでした。');return;}
   const r=results[0], lat=Number(r.lat), lon=Number(r.lon);
   searchMarker.setLatLng([lat,lon]).setOpacity(1);
   map.setView([lat,lon], Math.max(map.getZoom(),6), {animate:true});
   searchMarker.bindPopup('<strong>'+escapeHtml(r.display_name)+'</strong>').openPopup();
   showStatus(r.display_name);
 }catch(e){showStatus('検索エラー：'+e.message);}
}
function escapeHtml(s){
 return s.replace(/[&<>"']/g,function(c){
   return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
 });
}
document.getElementById('searchButton').addEventListener('click',searchPlace);
document.getElementById('searchInput').addEventListener('keydown',function(e){
 if(e.key==='Enter')searchPlace();
});
</script></body></html>
