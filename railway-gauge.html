<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界の鉄道軌間</title>
<!-- Leaflet本体のCSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
<style>
/* ------------------------------------------------------------
   ページ全体
------------------------------------------------------------ */
html,
body,
#map {
    width: 100%;
    height: 100%;
    margin: 0;
}
body {
    overflow: hidden;
}
/* ------------------------------------------------------------
   凡例
------------------------------------------------------------ */
.legend {
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
    font-size: 13px;
    line-height: 22px;
}
.legend i {
    display: inline-block;
    width: 18px;
    height: 18px;
    margin-right: 7px;
    vertical-align: -4px;
    border: 1px solid #777;
}
</style>
</head>
<body>
<!-- 地図を表示する場所 -->
<div id="map"></div>
<!-- Leaflet本体 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    /* ============================================================
       1. 各国の主な鉄道軌間
       ------------------------------------------------------------
       単位は mm。
       「mixed」は、複数の軌間が存在していて、
       1種類だけを代表値として扱うのが難しい国。
    ============================================================ */
    const countryGauge = {
        /* アジア */
        "Japan": "1067",
        "Taiwan": "1067",
        "Indonesia": "1067",
        "Philippines": "1067",
        "China": "1435",
        "North Korea": "1435",
        "South Korea": "1435",
        "India": "1676",
        "Pakistan": "1676",
        "Bangladesh": "1676",
        "Sri Lanka": "1676",
        "Thailand": "1000",
        "Malaysia": "1000",
        "Myanmar": "1000",
        "Cambodia": "1000",
        "Vietnam": "1000",
        "Laos": "1000",
        "Singapore": "1000",
        /* ヨーロッパ */
        "United Kingdom": "1435",
        "Ireland": "1600",
        "France": "1435",
        "Germany": "1435",
        "Italy": "1435",
        "Switzerland": "1435",
        "Austria": "1435",
        "Belgium": "1435",
        "Netherlands": "1435",
        "Luxembourg": "1435",
        "Denmark": "1435",
        "Norway": "1435",
        "Sweden": "1435",
        "Poland": "1435",
        "Czechia": "1435",
        "Slovakia": "1435",
        "Hungary": "1435",
        "Romania": "1435",
        "Bulgaria": "1435",
        "Greece": "1435",
        "Croatia": "1435",
        "Slovenia": "1435",
        "Bosnia and Herzegovina": "1435",
        "Serbia": "1435",
        "North Macedonia": "1435",
        "Albania": "1435",
        "Turkey": "1435",
        "Spain": "1668",
        "Portugal": "1668",
        "Finland": "1524",
        "Russia": "1520",
        "Ukraine": "1520",
        "Belarus": "1520",
        "Estonia": "1520",
        "Latvia": "1520",
        "Lithuania": "1520",
        "Moldova": "1520",
        "Georgia": "1520",
        "Armenia": "1520",
        "Azerbaijan": "1520",
        "Kazakhstan": "1520",
        "Kyrgyzstan": "1520",
        "Uzbekistan": "1520",
        "Turkmenistan": "1520",
        "Tajikistan": "1520",
        "Mongolia": "1520",
        /* 北米・中南米 */
        "United States": "1435",
        "Canada": "1435",
        "Mexico": "1435",
        "Cuba": "1435",
        "Argentina": "1676",
        "Chile": "1676",
        "Brazil": "mixed",
        "Bolivia": "1000",
        "Peru": "1435",
        "Uruguay": "1435",
        "Paraguay": "1435",
        "Ecuador": "1435",
        "Colombia": "1435",
        "Venezuela": "1435",
        /* アフリカ */
        "South Africa": "1067",
        "Ghana": "1067",
        "Nigeria": "1067",
        "Angola": "1067",
        "Zimbabwe": "1067",
        "Zambia": "1067",
        "Mozambique": "1067",
        "Namibia": "1067",
        "Botswana": "1067",
        "Eswatini": "1067",
        "Lesotho": "1067",
        "Kenya": "1000",
        "Uganda": "1000",
        "Tanzania": "1000",
        "Ethiopia": "1000",
        "Senegal": "1000",
        "Cameroon": "1000",
        "Madagascar": "1000",
        "Algeria": "1435",
        "Morocco": "1435",
        "Tunisia": "1435",
        "Mauritania": "1435",
        /* オセアニア */
        "Australia": "mixed",
        "New Zealand": "1067"
    };
    /* ============================================================
       2. 国名の違いを吸収するための別名
       ------------------------------------------------------------
       GeoJSONと上の国名データで国名が違う場合に使用する。
    ============================================================ */
    const countryNameAliases = {
        "United States of America": "United States",
        "Russian Federation": "Russia",
        "Korea, Republic of": "South Korea",
        "Republic of Korea": "South Korea",
        "Türkiye": "Turkey",
        "Czech Republic": "Czechia",
        "Viet Nam": "Vietnam",
        "United Republic of Tanzania": "Tanzania"
    };
    /* ============================================================
       3. 軌間ごとの色
    ============================================================ */
    const gaugeColors = {
        "1676": "#ffd92f",
        "1668": "#e5c494",
        "1600": "#b3b3b3",
        "1524": "#a6d854",
        "1520": "#e78ac3",
        "1435": "#8da0cb",
        "1067": "#fc8d62",
        "1000": "#66c2a5",
        "mixed": "#1b9e77",
        "none": "#d9d9d9"
    };
    /* ============================================================
       4. 凡例に表示する名称
    ============================================================ */
    const gaugeLabels = {
        "1676": "1,676 mm（インド軌）",
        "1668": "1,668 mm（イベリア軌）",
        "1600": "1,600 mm（アイルランド等）",
        "1524": "1,524 mm（フィンランド等）",
        "1520": "1,520 mm（旧ソ連圏）",
        "1435": "1,435 mm（標準軌）",
        "1067": "1,067 mm（ケープ軌間）",
        "1000": "1,000 mm（メーターゲージ）",
        "mixed": "複数の軌間",
        "none": "データなし"
    };
    /* ============================================================
       5. 地図を作成
       ============================================================ */
    const map = L.map("map", {
        minZoom: 1,
        maxZoom: 7,
        // 東西方向に世界地図を繰り返し表示
        worldCopyJump: true,
        // ズームボタンは後で手動追加する
        zoomControl: false
    }).setView([35, 55], 2);
    /* ============================================================
       6. 背景地図
       ============================================================ */
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);
    /* ============================================================
       7. GeoJSONの国名を取得
       ============================================================ */
    function getCountryName(properties) {
        const originalName =
            properties.ADMIN ||
            properties.name ||
            "";
        return countryNameAliases[originalName] || originalName;
    }
    /* ============================================================
       8. 国の色を決める
       ============================================================ */
    function getCountryStyle(feature) {
        const countryName = getCountryName(feature.properties);
        const gauge = countryGauge[countryName];
        const color =
            gaugeColors[gauge] ||
            gaugeColors["none"];
        return {
            fillColor: color,
            color: "#777",
            weight: 0.6,
            fillOpacity: gauge ? 0.82 : 0.45
        };
    }
    /* ============================================================
       9. 国をクリックしたときの内容
    ============================================================ */
    function createCountryPopup(countryName, gauge) {
        if (!gauge) {
            return `
                <b>${countryName}</b><br>
                データなし
            `;
        }
        return `
            <b>${countryName}</b><br>
            <strong>${gaugeLabels[gauge]}</strong>
        `;
    }
    /* ============================================================
       10. 世界地図のGeoJSONを読み込む
    ============================================================ */
    fetch(
        "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
    )
    .then(response => response.json())
    .then(worldData => {
        const countryLayer = L.geoJSON(
            worldData,
            {
                /* 国ごとの色 */
                style: getCountryStyle,
                /* 国ごとのイベント */
                onEachFeature: function (feature, layer) {
                    const countryName =
                        getCountryName(feature.properties);
                    const gauge =
                        countryGauge[countryName];
                    /* クリック時のポップアップ */
                    layer.bindPopup(
                        createCountryPopup(
                            countryName,
                            gauge
                        )
                    );
                    /* マウスを重ねたとき */
                    layer.on({
                        mouseover: function (event) {
                            event.target.setStyle({
                                weight: 2,
                                color: "#222"
                            });
                        },
                        /* マウスを離したとき */
                        mouseout: function (event) {
                            countryLayer.resetStyle(
                                event.target
                            );
                        }
                    });
                }
            }
        ).addTo(map);
    });
    /* ============================================================
       11. 凡例
       ------------------------------------------------------------
       軌間の大きい順に表示する。
       左上に配置し、その下にズームボタンを置く。
    ============================================================ */
    const legend = L.control({
        position: "topleft"
    });
    legend.onAdd = function () {
        const container =
            L.DomUtil.create(
                "div",
                "legend"
            );
        container.innerHTML =
            "<b>主な鉄道軌間</b><br>";
        /*
         * 大きい軌間から順番に表示
         */
        const gaugeOrder = [
            "1676",
            "1668",
            "1600",
            "1524",
            "1520",
            "1435",
            "1067",
            "1000",
            "mixed",
            "none"
        ];
        gaugeOrder.forEach(function (gauge) {
            container.innerHTML +=
                '<i style="background:' +
                gaugeColors[gauge] +
                '"></i>' +
                gaugeLabels[gauge] +
                "<br>";
        });
        return container;
    };
    /* 凡例を地図に追加 */
    legend.addTo(map);
    /* ============================================================
       12. ズームボタン
       ------------------------------------------------------------
       凡例を先に追加し、その「下」にズームボタンを追加する。
       CSSで位置を無理にずらすのではなく、Leafletの
       コントロールの並び順そのものを利用する。
    ============================================================ */
    L.control.zoom({
        position: "topleft"
    }).addTo(map);
</script>
</body>
</html>
