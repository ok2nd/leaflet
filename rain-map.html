<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leaflet 雨雲レーダー</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, "Yu Gothic", Meiryo, sans-serif;
}

/* 左上コントロール */
.map-controls {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    width: 250px;
    background: rgba(255,255,255,.94);
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    padding: 10px;
    box-sizing: border-box;
}

.control-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

.control-row:last-child {
    margin-bottom: 0;
}

button, select {
    height: 34px;
    border: 1px solid #aaa;
    border-radius: 5px;
    background: white;
    padding: 3px 8px;
    font-size: 14px;
    cursor: pointer;
}

button:hover, select:hover {
    background: #f2f2f2;
}

button {
    flex: 1;
}

#source {
    width: 100%;
}

#timeSlider {
    width: 100%;
    margin: 5px 0 0;
}

.time-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #333;
}

#timeText {
    text-align: center;
    font-weight: bold;
    margin-top: 4px;
    font-size: 13px;
}

.status {
    font-size: 11px;
    color: #555;
    margin-top: 5px;
    line-height: 1.4;
}

/* 右下の帰属表示 */
.attribution-extra {
    position: absolute;
    z-index: 1000;
    right: 5px;
    bottom: 5px;
    background: rgba(255,255,255,.75);
    padding: 2px 5px;
    font-size: 10px;
    color: #444;
    border-radius: 3px;
}

@media (max-width: 600px) {
    .map-controls {
        width: calc(100vw - 20px);
        max-width: 330px;
    }

    button, select {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="map-controls">
    <div class="control-row">
        <button id="locationBtn">◎ 現在地</button>
        <button id="playBtn">▶ 再生</button>
    </div>

    <div class="control-row">
        <select id="source">
            <option value="rainviewer">RainViewer</option>
            <option value="openweather">OpenWeatherMap</option>
        </select>
    </div>

    <input id="timeSlider" type="range" min="-120" max="0" step="10" value="0">

    <div class="time-label">
        <span id="pastLabel">2時間前</span>
        <span>現在</span>
        <span id="futureLabel">現在</span>
    </div>

    <div id="timeText">現在</div>

    <div class="status" id="status">
        雨雲データを取得中...
    </div>
</div>

<div class="attribution-extra">
    雨雲：RainViewer / OpenWeatherMap
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Google Maps を Leaflet 上で使うためのプラグイン -->
<script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.15.0/dist/Leaflet.GoogleMutant.js"></script>

<script>
/*
=========================================================
設定
=========================================================
*/

// OpenWeatherMap APIキー
// 必要な場合だけ入力する。
// RainViewerだけ使う場合は空欄でよい。
const OPENWEATHER_API_KEY = "d39b8f3b06fd87bdf447a70ede5b990e";

// Google Maps JavaScript APIキー
// Googleマップを使う場合に入力する。
// OSMだけなら空欄でよい。
const GOOGLE_MAPS_API_KEY = "";


/*
=========================================================
地図
=========================================================
*/

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true,
    minZoom: 2,
    maxZoom: 18
}).setView([36.5, 138.0], 5);

// OpenStreetMap
const osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
    }
).addTo(map);

// Google Maps
let googleRoad = null;
let googleSatellite = null;

if (GOOGLE_MAPS_API_KEY) {
    googleRoad = L.gridLayer.googleMutant({
        type: "roadmap",
        maxZoom: 20,
        attribution: "&copy; Google"
    });

    googleSatellite = L.gridLayer.googleMutant({
        type: "hybrid",
        maxZoom: 20,
        attribution: "&copy; Google"
    });
}

const baseMaps = {
    "OpenStreetMap": osm
};

if (googleRoad) {
    baseMaps["Googleマップ"] = googleRoad;
    baseMaps["Google衛星写真"] = googleSatellite;
}

L.control.layers(baseMaps, null, {
    collapsed: true
}).addTo(map);


/*
=========================================================
雨雲レイヤー
=========================================================
*/

let rainViewerFrames = [];
let rainViewerHost = "";
let rainLayer = null;

let currentSource = "rainviewer";
let currentOffset = 0;

const sourceSelect = document.getElementById("source");
const slider = document.getElementById("timeSlider");
const timeText = document.getElementById("timeText");
const statusText = document.getElementById("status");
const playBtn = document.getElementById("playBtn");


/*
=========================================================
RainViewerデータ取得
=========================================================
*/

async function loadRainViewer() {

    try {

        const response = await fetch(
            "https://api.rainviewer.com/public/weather-maps.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("RainViewer API error");
        }

        const data = await response.json();

        rainViewerHost = data.host || "";
        rainViewerFrames = [];

        if (data.radar && data.radar.past) {
            rainViewerFrames = data.radar.past.slice();
        }

        if (!rainViewerFrames.length) {
            throw new Error("RainViewerのフレームがありません");
        }

        // 現在時刻
        rainViewerFrames.sort((a, b) => a.time - b.time);

        const latest =
            rainViewerFrames[rainViewerFrames.length - 1].time;

        window.rainViewerLatest = latest;

        setRainViewerSlider();

        statusText.textContent =
            "RainViewer：過去2時間・10分間隔";

        updateRainLayer();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "RainViewerのデータ取得に失敗しました。";
    }
}


/*
=========================================================
RainViewerスライダー
=========================================================
*/

function setRainViewerSlider() {

    slider.min = "-120";
    slider.max = "0";
    slider.step = "10";

    currentOffset = Math.max(
        -120,
        Math.min(0, currentOffset)
    );

    slider.value = currentOffset;

    document.getElementById("pastLabel").textContent =
        "2時間前";

    document.getElementById("futureLabel").textContent =
        "現在";

    updateTimeText();
}


/*
=========================================================
OpenWeatherMapスライダー
=========================================================
*/

function setOpenWeatherSlider() {

    // Global precipitation radar:
    // 過去2日、未来6時間程度
    slider.min = "-2880";
    slider.max = "360";
    slider.step = "10";

    currentOffset = Math.max(
        -2880,
        Math.min(360, currentOffset)
    );

    slider.value = currentOffset;

    document.getElementById("pastLabel").textContent =
        "2日前";

    document.getElementById("futureLabel").textContent =
        "6時間後";

    updateTimeText();
}


/*
=========================================================
時間表示
=========================================================
*/

function updateTimeText() {

    const now = new Date();

    const offset = Number(slider.value);

    const target = new Date(
        now.getTime() + offset * 60000
    );

    if (Math.abs(offset) < 1) {

        timeText.textContent = "現在";

    } else {

        const sign = offset > 0 ? "+" : "";

        timeText.textContent =
            sign + offset + "分";

        timeText.textContent +=
            "  " +
            target.toLocaleString(
                "ja-JP",
                {
                    month: "numeric",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }
}


/*
=========================================================
RainViewerレイヤー
=========================================================
*/

function updateRainLayer() {

    if (!rainViewerFrames.length) {
        return;
    }

    const nowUnix = Math.floor(Date.now() / 1000);

    const targetUnix =
        nowUnix + Number(slider.value) * 60;

    let selected = rainViewerFrames[0];

    let minDiff = Infinity;

    rainViewerFrames.forEach(frame => {

        const diff =
            Math.abs(frame.time - targetUnix);

        if (diff < minDiff) {
            minDiff = diff;
            selected = frame;
        }
    });

    if (rainLayer) {
        map.removeLayer(rainLayer);
    }

    const url =
        rainViewerHost +
        selected.path +
        "/256/{z}/{x}/{y}/2/1_1.png";

    rainLayer = L.tileLayer(url, {
        opacity: 0.65,
        maxZoom: 7,
        tileSize: 256,
        attribution:
            '<a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
    }).addTo(map);

    const frameDate =
        new Date(selected.time * 1000);

    timeText.textContent =
        "RainViewer " +
        frameDate.toLocaleString(
            "ja-JP",
            {
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}


/*
=========================================================
OpenWeatherMap Global Precipitation Radar
=========================================================
*/

function updateOpenWeatherLayer() {

    if (!OPENWEATHER_API_KEY) {

        if (rainLayer) {
            map.removeLayer(rainLayer);
            rainLayer = null;
        }

        statusText.innerHTML =
            "OpenWeatherMap APIキーが設定されていません。<br>" +
            "HTML冒頭の OPENWEATHER_API_KEY に入力してください。";

        return;
    }

    const now = Date.now();

    let targetTime =
        now + Number(slider.value) * 60000;

    let unix =
        Math.floor(targetTime / 1000);

    // 10分単位へ丸める
    unix =
        Math.floor(unix / 600) * 600;

    /*
     * Global precipitation map
     * 過去2日
     * 未来は契約/APIにより利用可能範囲が異なる
     */
    let url =
        "https://maps.openweathermap.org/maps/2.0/radar/" +
        "{z}/{x}/{y}" +
        "?appid=" +
        encodeURIComponent(OPENWEATHER_API_KEY) +
        "&tm=" +
        unix;

    // 現在～未来は forecast URL を使用
    if (Number(slider.value) > 0) {

        url =
            "https://maps.openweathermap.org/maps/2.0/radar/forecast/" +
            "{z}/{x}/{y}" +
            "?appid=" +
            encodeURIComponent(OPENWEATHER_API_KEY) +
            "&tm=" +
            unix;
    }

    if (rainLayer) {
        map.removeLayer(rainLayer);
    }

    rainLayer = L.tileLayer(url, {
        opacity: 0.65,
        minZoom: 3,
        maxZoom: 7,
        tileSize: 256,
        attribution:
            '<a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a>'
    }).addTo(map);

    const targetDate =
        new Date(unix * 1000);

    timeText.textContent =
        "OpenWeatherMap " +
        targetDate.toLocaleString(
            "ja-JP",
            {
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    statusText.textContent =
        "OpenWeatherMap：10分間隔";
}


/*
=========================================================
レイヤー更新
=========================================================
*/

function updateWeatherLayer() {

    currentOffset = Number(slider.value);

    updateTimeText();

    if (currentSource === "rainviewer") {

        updateRainLayer();

    } else {

        updateOpenWeatherLayer();
    }
}


/*
=========================================================
スライダー
=========================================================
*/

slider.addEventListener("input", function() {

    updateWeatherLayer();

});


/*
=========================================================
雨雲ソース切替
=========================================================
*/

sourceSelect.addEventListener("change", function() {

    currentSource = this.value;

    if (currentSource === "rainviewer") {

        currentOffset =
            Math.min(0, currentOffset);

        setRainViewerSlider();

        statusText.textContent =
            "RainViewer：過去2時間・10分間隔";

        updateRainLayer();

    } else {

        setOpenWeatherSlider();

        updateOpenWeatherLayer();
    }
});


/*
=========================================================
現在地
=========================================================
*/

document.getElementById("locationBtn")
    .addEventListener("click", function() {

        if (!navigator.geolocation) {

            alert(
                "このブラウザでは現在地取得に対応していません。"
            );

            return;
        }

        this.textContent = "取得中...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;

                map.setView(
                    [lat, lon],
                    10,
                    {
                        animate: true
                    }
                );

                L.marker([lat, lon])
                    .addTo(map)
                    .bindPopup("現在地")
                    .openPopup();

                document.getElementById("locationBtn")
                    .textContent = "◎ 現在地";
            },

            function(error) {

                console.error(error);

                alert(
                    "現在地を取得できませんでした。\n" +
                    "ブラウザの位置情報許可を確認してください。"
                );

                document.getElementById("locationBtn")
                    .textContent = "◎ 現在地";
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 60000
            }
        );
    });


/*
=========================================================
再生
=========================================================
*/

let playing = false;
let playTimer = null;

playBtn.addEventListener("click", function() {

    playing = !playing;

    if (playing) {

        this.textContent = "⏸ 停止";

        playTimer =
            setInterval(function() {

                let value =
                    Number(slider.value);

                value += Number(slider.step);

                if (value > Number(slider.max)) {
                    value = Number(slider.min);
                }

                slider.value = value;

                updateWeatherLayer();

            }, 700);

    } else {

        this.textContent = "▶ 再生";

        clearInterval(playTimer);
    }
});


/*
=========================================================
初期処理
=========================================================
*/

loadRainViewer();

</script>
</body>
</html>
