<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leaflet 雨雲レーダー</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, "Yu Gothic", Meiryo, sans-serif;
}

.map-controls {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    width: 270px;
    background: rgba(255,255,255,.94);
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    padding: 10px;
    box-sizing: border-box;
}

.control-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

button {
    height: 34px;
    flex: 1;
    border: 1px solid #aaa;
    border-radius: 5px;
    background: white;
    padding: 3px 8px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #f2f2f2;
}

#timeSlider {
    width: 100%;
    margin: 5px 0 0;
}

.time-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #333;
}

#timeText {
    text-align: center;
    font-weight: bold;
    margin-top: 4px;
    font-size: 13px;
}

.status {
    font-size: 11px;
    color: #555;
    margin-top: 5px;
    line-height: 1.4;
}

@media (max-width: 600px) {
    .map-controls {
        width: calc(100vw - 20px);
        max-width: 340px;
    }

    button {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="map-controls">
    <div class="control-row">
        <button id="locationBtn">◎ 現在地</button>
        <button id="playBtn">▶ 再生</button>
    </div>

    <input id="timeSlider" type="range">

    <div class="time-label">
        <span id="pastLabel">過去</span>
        <span>現在</span>
        <span id="futureLabel">未来</span>
    </div>

    <div id="timeText">現在</div>

    <div class="status" id="status">
        RainViewerデータを取得中...
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/*
=========================================================
Leaflet 雨雲レーダー
・OpenStreetMapのみ
・RainViewerのみ
・現在地
・過去～現在
・RainViewer APIが未来フレームを返す場合は未来も表示
=========================================================
*/

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true,
    minZoom: 2,
    maxZoom: 7
}).setView([36.5, 138.0], 5);


/*
=========================================================
OpenStreetMap
=========================================================
*/

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
    }
).addTo(map);


/*
=========================================================
変数
=========================================================
*/

let rainViewerHost = "";
let rainViewerFrames = [];
let rainLayer = null;

const slider = document.getElementById("timeSlider");
const timeText = document.getElementById("timeText");
const statusText = document.getElementById("status");
const playBtn = document.getElementById("playBtn");

let playing = false;
let playTimer = null;


/*
=========================================================
RainViewerデータ取得
=========================================================
*/

async function loadRainViewer() {

    try {

        const response = await fetch(
            "https://api.rainviewer.com/public/weather-maps.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("RainViewer API error");
        }

        const data = await response.json();

        rainViewerHost = data.host || "";

        const past =
            data.radar && Array.isArray(data.radar.past)
                ? data.radar.past
                : [];

        /*
         * APIがnowcastを返している場合だけ未来を追加。
         * 現在のRainViewer公開APIでは将来フレームが
         * 提供されない場合があるため、存在を確認してから使用する。
         */
        const nowcast =
            data.radar && Array.isArray(data.radar.nowcast)
                ? data.radar.nowcast
                : [];

        rainViewerFrames =
            past.concat(nowcast);

        rainViewerFrames.sort(
            (a, b) => a.time - b.time
        );

        if (!rainViewerFrames.length) {
            throw new Error("RainViewerのフレームがありません");
        }

        configureSlider();

        updateRainLayer();

        if (nowcast.length > 0) {

            statusText.textContent =
                "RainViewer：過去2時間＋未来（API提供分）";

        } else {

            statusText.textContent =
                "RainViewer：過去2時間（現在、未来フレームなし）";
        }

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "RainViewerのデータ取得に失敗しました。";
    }
}


/*
=========================================================
スライダー設定
=========================================================
*/

function configureSlider() {

    const first =
        rainViewerFrames[0].time;

    const last =
        rainViewerFrames[
            rainViewerFrames.length - 1
        ].time;

    const latest =
        rainViewerFrames[
            rainViewerFrames.length - 1
        ].time;

    /*
     * スライダー値は「現在の最新フレームからの分数」
     */
    const minOffset =
        Math.round(
            (first - latest) / 60
        );

    const maxOffset =
        Math.round(
            (last - latest) / 60
        );

    slider.min = minOffset;
    slider.max = maxOffset;
    slider.step = 10;

    slider.value = maxOffset;

    document.getElementById("pastLabel").textContent =
        Math.round(Math.abs(minOffset) / 60) + "時間前";

    if (maxOffset > 0) {

        document.getElementById("futureLabel").textContent =
            "+" + maxOffset + "分";

    } else {

        document.getElementById("futureLabel").textContent =
            "現在";
    }
}


/*
=========================================================
対象フレーム取得
=========================================================
*/

function getSelectedFrame() {

    if (!rainViewerFrames.length) {
        return null;
    }

    const latest =
        rainViewerFrames[
            rainViewerFrames.length - 1
        ].time;

    const target =
        latest +
        Number(slider.value) * 60;

    let selected =
        rainViewerFrames[0];

    let minDiff =
        Infinity;

    rainViewerFrames.forEach(frame => {

        const diff =
            Math.abs(frame.time - target);

        if (diff < minDiff) {

            minDiff = diff;
            selected = frame;
        }
    });

    return selected;
}


/*
=========================================================
RainViewerタイル
=========================================================
*/

function updateRainLayer() {

    const selected =
        getSelectedFrame();

    if (!selected) {
        return;
    }

    if (rainLayer) {
        map.removeLayer(rainLayer);
    }

    const url =
        rainViewerHost +
        selected.path +
        "/256/{z}/{x}/{y}/2/1_1.png";

    rainLayer =
        L.tileLayer(url, {
            opacity: 0.65,
            maxZoom: 7,
            tileSize: 256,
            attribution:
                '<a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
        }).addTo(map);

    const date =
        new Date(selected.time * 1000);

    timeText.textContent =
        date.toLocaleString(
            "ja-JP",
            {
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    const latest =
        rainViewerFrames[
            rainViewerFrames.length - 1
        ].time;

    const offset =
        Math.round(
            (selected.time - latest) / 60
        );

    if (offset > 0) {

        timeText.textContent +=
            "  （+" + offset + "分）";

    } else if (offset < 0) {

        timeText.textContent +=
            "  （" + offset + "分）";

    } else {

        timeText.textContent +=
            "  （現在）";
    }
}


/*
=========================================================
スライダー
=========================================================
*/

slider.addEventListener("input", function() {

    updateRainLayer();

});


/*
=========================================================
現在地
=========================================================
*/

document.getElementById("locationBtn")
    .addEventListener("click", function() {

        if (!navigator.geolocation) {

            alert(
                "このブラウザでは現在地取得に対応していません。"
            );

            return;
        }

        const button = this;

        button.textContent = "取得中...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;

                map.setView(
                    [lat, lon],
                    10,
                    {
                        animate: true
                    }
                );

                L.marker([lat, lon])
                    .addTo(map)
                    .bindPopup("現在地")
                    .openPopup();

                button.textContent =
                    "◎ 現在地";
            },

            function(error) {

                console.error(error);

                alert(
                    "現在地を取得できませんでした。\n" +
                    "ブラウザの位置情報許可を確認してください。"
                );

                button.textContent =
                    "◎ 現在地";
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 60000
            }
        );
    });


/*
=========================================================
再生
=========================================================
*/

playBtn.addEventListener("click", function() {

    playing = !playing;

    if (playing) {

        this.textContent = "⏸ 停止";

        playTimer =
            setInterval(function() {

                let value =
                    Number(slider.value);

                value += Number(slider.step);

                if (
                    value >
                    Number(slider.max)
                ) {
                    value =
                        Number(slider.min);
                }

                slider.value = value;

                updateRainLayer();

            }, 700);

    } else {

        this.textContent = "▶ 再生";

        clearInterval(playTimer);
    }
});


/*
=========================================================
初期処理
=========================================================
*/

loadRainViewer();

</script>
</body>
</html>
