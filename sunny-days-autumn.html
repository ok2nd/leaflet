/* ===== 地図初期化 ===== */
const map = L.map('map', {
  zoomSnap: 0.25
}).setView([37.6, 138.0], 5.4);

/* 背景地図：OpenStreetMap */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

/* 5段階の色分け（やわらかい暖色系：晴れ日数が多いほど濃いオレンジ） */
function getColor(d) {
  return d > 49 ? '#e6720f' :
         d > 46 ? '#f1953c' :
         d > 43 ? '#fbb45d' :
         d > 39 ? '#fdcf8b' :
                  '#fee9b8';
}

function styleFeature(feature) {
  const name = feature.properties.name;
  const rec = sunnyData[name];
  const val = rec ? rec.value : null;
  return {
    fillColor: val !== null ? getColor(val) : '#eeeeee',
    weight: 1,
    opacity: 0.8,
    color: '#777',
    fillOpacity: 0.78
  };
}

/* ===== 情報パネル（右上） ===== */
const info = L.control({position: 'topright'});
info.onAdd = function () {
  this._div = L.DomUtil.create('div', 'info');
  this.update();
  return this._div;
};
info.update = function (props) {
  if (props) {
    const rec = sunnyData[props.name];
    const label = props.type === 'hokkaido' ? props.name : props.name;
    const stationText = rec && rec.station ? '（' + rec.station + '）' : '';
    const valText = rec ? rec.value + ' 日' : 'データなし';
    this._div.innerHTML =
      '<h4>' + label + stationText + '</h4>' +
      '秋（9〜11月）の平年晴れ日数<br><b style="font-size:1.1rem;">' + valText + '</b>';
  } else {
    this._div.innerHTML = '<h4>秋の平年晴れ日数</h4>都道府県／北海道の振興局にマウスを乗せると詳細が表示されます。';
  }
};
info.addTo(map);

/* ===== ハイライト・イベント ===== */
function highlightFeature(e) {
  const layer = e.target;
  layer.setStyle({
    weight: 1.6,
    color: '#555',
    fillOpacity: 0.85
  });
  layer.bringToFront();
  info.update(layer.feature.properties);
}

function resetHighlight(e) {
  geojsonLayer.resetStyle(e.target);
  info.update();
}

function onEachFeature(feature, layer) {
  const name = feature.properties.name;
  const rec = sunnyData[name];
  const stationText = rec && rec.station ? '（' + rec.station + '）' : '';
  const valText = rec ? rec.value + ' 日' : 'データなし';
  layer.bindPopup('<b>' + name + stationText + '</b><br>平年晴れ日数：' + valText);
  layer.on({
    mouseover: highlightFeature,
    mouseout: resetHighlight,
    click: function (e) {
      info.update(layer.feature.properties);
    }
  });
}

const geojsonLayer = L.geoJson(geojsonData, {
  style: styleFeature,
  onEachFeature: onEachFeature
}).addTo(map);

/* ===== 凡例（左下） ===== */
const legend = L.control({position: 'bottomleft'});
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  const grades = [0, 39, 43, 46, 49];
  const labels = ['〜39日', '39〜43日', '43〜46日', '46〜49日', '49日〜'];
  div.innerHTML += '<h4>秋の平年晴れ日数</h4>';
  for (let i = 0; i < grades.length; i++) {
    div.innerHTML +=
      '<span class="row"><i style="background:' + getColor(grades[i] + 0.1) + '"></i>' + labels[i] + '</span>';
  }
  return div;
};
legend.addTo(map);
</script>
