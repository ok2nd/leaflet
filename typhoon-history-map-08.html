<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台風経路マップ（年別）</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiYo, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        /* 台風名ラベル（経路の起点付近に表示） */
        .typhoon-name-label {
            background: rgba(0, 0, 0, 0.82);
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 4px;
            padding: 1px 5px;
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        /* 上陸マーカーのラベル */
        .landfall-label {
            background: rgba(192, 57, 43, 0.95);
            color: #ffffff;
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        /* ------------------------------------------------------------- */
        /* 年選択コントロール（左上） */
        /* ------------------------------------------------------------- */
        #year-control {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 10px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 13px;
            color: #2c3e50;
        }
        #year-control label {
            font-weight: bold;
            margin-right: 6px;
        }
        #year-select {
            font-size: 14px;
            padding: 3px 4px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        #year-select:disabled {
            opacity: 0.6;
        }

        /* ------------------------------------------------------------- */
        /* 台風リストパネル（右上） */
        /* ------------------------------------------------------------- */
        #typhoon-list-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 150px;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #typhoon-list-header {
            padding: 8px 10px 6px 10px;
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #typhoon-list-header .toggle-all-btn {
            font-size: 11px;
            font-weight: normal;
            color: #2980b9;
            cursor: pointer;
            border: 1px solid #2980b9;
            border-radius: 3px;
            padding: 1px 5px;
            background: #fff;
        }
        #typhoon-list-body {
            overflow-y: auto;
            padding: 4px 0;
        }
        .storm-row {
            display: flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 12px;
            color: #333;
            cursor: pointer;
            line-height: 1.35;
        }
        .storm-row:hover {
            background: #f0f4f8;
        }
        .storm-row input[type="checkbox"] {
            margin-right: 6px;
            flex-shrink: 0;
        }
        .storm-row .storm-max-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.3);
            cursor: help;
        }
        .storm-row .storm-text b {
            color: #2c3e50;
        }
        .storm-row .storm-text .storm-period {
            display: block;
            font-size: 10px;
            color: #888;
        }

        /* ------------------------------------------------------------- */
        /* 階級（強さ）凡例パネル（右下） */
        /* ------------------------------------------------------------- */
        #legend-panel {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 10px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 11px;
            color: #333;
        }
        #legend-panel .legend-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            margin: 2px 0;
        }
        .legend-swatch {
            width: 18px;
            height: 4px;
            margin-right: 6px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ------------------------------------------------------------- */
        /* ステータス表示パネル（左下） */
        /* ------------------------------------------------------------- */
        #status-panel {
            position: absolute;
            bottom: 20px;
            left: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 12px;
            color: #333;
            max-width: 300px;
            line-height: 1.5;
        }

        .leaflet-popup-content {
            margin: 10px 12px;
        }

        @media (max-width: 640px) {
            #typhoon-list-panel { width: 120px; max-height: 50vh; }
            #year-control, #status-panel, #legend-panel { font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="year-control">
        <label for="year-select">表示年:</label>
        <select id="year-select"></select>
    </div>

    <div id="typhoon-list-panel">
        <div id="typhoon-list-header">
            <span id="typhoon-list-title">一覧</span>
            <span class="toggle-all-btn" id="toggle-all-btn">全て非表示</span>
        </div>
        <div id="typhoon-list-body"></div>
    </div>

    <div id="legend-panel">
        <div class="legend-title">階級（強さ）</div>
        <div id="legend-body"></div>
    </div>

    <div id="status-panel">データを読み込み中...</div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var statusEl = document.getElementById('status-panel');
            var yearSelect = document.getElementById('year-select');
            var listBody = document.getElementById('typhoon-list-body');
            var listTitle = document.getElementById('typhoon-list-title');
            var toggleAllBtn = document.getElementById('toggle-all-btn');
            var legendBody = document.getElementById('legend-body');
            var yearControlEl = document.getElementById('year-control');
            var typhoonListPanelEl = document.getElementById('typhoon-list-panel');

            // ------------------------------------------------------------------
            // 地図タイルの設定
            // ------------------------------------------------------------------
            var gsiTile = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
                maxZoom: 18
            });

            var osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            });

            var googleMapTile = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps',
                maxZoom: 20
            });

            var map = L.map('map', {
                center: [25.0, 140.0],
                zoom: 4,
                layers: [osmTile],
                zoomControl: false
            });

            var baseMaps = {
                "OpenStreetMap": osmTile,
                "Google Maps": googleMapTile,
                "地理院タイル": gsiTile
            };
            L.control.layers(baseMaps).addTo(map);

            var typhoonRootGroup = L.layerGroup().addTo(map);

            // ------------------------------------------------------------------
            // 独自パネルをLeafletの「コントロール」として登録する。
            // こうすることで、同じ角（コーナー）にある拡大縮小(+/-)ボタンや
            // レイヤー切替えコントロールの下に自動的に積み重なり、重ならなくなる。
            // ------------------------------------------------------------------
            function panelControl(el, position) {
                var PanelControl = L.Control.extend({
                    options: { position: position },
                    onAdd: function () {
                        L.DomEvent.disableClickPropagation(el);
                        L.DomEvent.disableScrollPropagation(el);
                        return el;
                    }
                });
                return new PanelControl();
            }
            map.addControl(panelControl(yearControlEl, 'topleft'));       // 先に追加＝上側に配置
            L.control.zoom({ position: 'topleft' }).addTo(map);          // 年プルダウンの下にズームボタンを配置
            map.addControl(panelControl(typhoonListPanelEl, 'topright')); // レイヤー切替えの下に積む

            // ------------------------------------------------------------------
            // 階級（強さ）の定義：気象庁 台風位置表CSVの「階級」列に対応
            // ------------------------------------------------------------------
            var GRADES = {
                2: { label: '熱帯低気圧',             color: '#95a5a6', dash: '3,5', weight: 2 },
                3: { label: '台風',                   color: '#2980b9', dash: null,  weight: 3 },
                4: { label: '強い台風',               color: '#e67e22', dash: null,  weight: 4 },
                5: { label: '非常に強い～猛烈な台風', color: '#e74c3c', dash: null,  weight: 5 },
                6: { label: '温帯低気圧',             color: '#7f8c8d', dash: '2,6', weight: 2 },
                7: { label: '責任領域外',             color: '#7f8c8d', dash: '2,6', weight: 2 }
            };
            function gradeInfo(g) {
                return GRADES[g] || { label: '不明', color: '#7f8c8d', dash: '2,6', weight: 2 };
            }

            // 「強さの順位」：気象庁の階級コードは数字が大きいほど強いとは限らない
            // （6=温帯低気圧、7=責任領域外 は、勢力が衰えた後の状態を表すコードで、
            //   数字は大きいが強さとしては最弱クラスに相当する）。
            // そのため、最大階級（一番強かった状態）の判定には専用の順位を使う。
            var INTENSITY_RANK = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 0, 7: 0 };
            function intensityRank(g) {
                return INTENSITY_RANK.hasOwnProperty(g) ? INTENSITY_RANK[g] : -1;
            }

            // 凡例を組み立て
            [2, 3, 4, 5, 6].forEach(function (g) {
                var info = gradeInfo(g);
                var row = document.createElement('div');
                row.className = 'legend-row';
                var swatch = document.createElement('span');
                swatch.className = 'legend-swatch';
                if (info.dash) {
                    swatch.style.backgroundImage = 'repeating-linear-gradient(90deg,' + info.color + ' 0 4px, transparent 4px 7px)';
                } else {
                    swatch.style.background = info.color;
                }
                row.appendChild(swatch);
                var label = document.createElement('span');
                label.textContent = info.label;
                row.appendChild(label);
                legendBody.appendChild(row);
            });
            (function () {
                var row = document.createElement('div');
                row.className = 'legend-row';
                var swatch = document.createElement('span');
                swatch.className = 'legend-swatch';
                swatch.style.background = '#c0392b';
                swatch.style.borderRadius = '50%';
                swatch.style.width = '8px';
                swatch.style.height = '8px';
                row.appendChild(swatch);
                var label = document.createElement('span');
                label.textContent = '上陸地点';
                row.appendChild(label);
                legendBody.appendChild(row);
            })();

            // ------------------------------------------------------------------
            // 年セレクトの組み立て（当年〜2001年）
            // ------------------------------------------------------------------
            var THIS_YEAR = new Date().getFullYear();
            var MIN_YEAR = 2001; // 気象庁「台風位置表」CSVは2001年以降に対応
            for (var y = THIS_YEAR; y >= MIN_YEAR; y--) {
                var opt = document.createElement('option');
                opt.value = String(y);
                opt.textContent = y + '年';
                yearSelect.appendChild(opt);
            }

            // ------------------------------------------------------------------
            // ユーティリティ
            // ------------------------------------------------------------------

            // UTCの年月日時から、JST表記の文字列を作る（ブラウザのタイムゾーンに依存しない）
            function formatJST(y, mo, d, h) {
                var utcMs = Date.UTC(y, mo - 1, d, h, 0, 0);
                var jstMs = utcMs + 9 * 60 * 60 * 1000;
                var jd = new Date(jstMs);
                var pad = function (n) { return (n < 10 ? '0' : '') + n; };
                return jd.getUTCFullYear() + '/' + pad(jd.getUTCMonth() + 1) + '/' + pad(jd.getUTCDate()) +
                    ' ' + pad(jd.getUTCHours()) + ':00';
            }
            function shortJST(y, mo, d, h) {
                var utcMs = Date.UTC(y, mo - 1, d, h, 0, 0);
                var jstMs = utcMs + 9 * 60 * 60 * 1000;
                var jd = new Date(jstMs);
                return (jd.getUTCMonth() + 1) + '/' + jd.getUTCDate();
            }

            function knotToMs(kt) {
                return Math.round(kt * 0.514444);
            }
            function nmToKm(nm) {
                return Math.round(nm * 1.852);
            }

            var DIR_LABELS = { 1: '北東', 2: '東', 3: '南東', 4: '南', 5: '南西', 6: '西', 7: '北西', 8: '北', 9: '（全域）' };
            function windAreaText(dirCode, longNm, shortNm) {
                if (!longNm || longNm <= 0) return null;
                if (dirCode === 9) {
                    return '全域 半径約' + nmToKm(longNm) + 'km';
                }
                var dirLabel = DIR_LABELS[dirCode] || '';
                return dirLabel + '方向に張り出し（長径約' + nmToKm(longNm) + 'km・短径約' + nmToKm(shortNm) + 'km）';
            }

            function popupHtml(displayName, tcNumber, p) {
                var info = gradeInfo(p.grade);
                var html = '<div style="font-size:13px; line-height:1.7; min-width:190px;">';
                html += '<b style="font-size:15px; color:#2c3e50;">' + displayName + '</b>';
                html += ' <span style="color:#999; font-size:11px;">(' + p.name + ')</span><br>';
                html += '<span style="color:#7f8c8d;">' + formatJST(p.year, p.month, p.day, p.hour) + ' JST</span>';
                html += '<hr style="margin:4px 0; border:0; border-top:1px solid #ccc;">';
                html += '<b>階級:</b> ' + info.label + '<br>';
                if (p.pressure) {
                    html += '<b>中心気圧:</b> ' + p.pressure + ' hPa<br>';
                }
                if (p.windKt && p.windKt > 0) {
                    html += '<b>最大風速:</b> ' + knotToMs(p.windKt) + ' m/s（' + p.windKt + 'kt）<br>';
                }
                var storm = windAreaText(p.storm50Dir, p.storm50Long, p.storm50Short);
                if (storm) {
                    html += '<b>暴風域:</b> ' + storm + '<br>';
                }
                var gale = windAreaText(p.gale30Dir, p.gale30Long, p.gale30Short);
                if (gale) {
                    html += '<b>強風域:</b> ' + gale + '<br>';
                }
                if (p.landfall) {
                    html += '<b style="color:#c0392b;">この地点で上陸（または通過）</b><br>';
                }
                html += '</div>';
                return html;
            }

            // ------------------------------------------------------------------
            // CSVパース（気象庁 台風位置表 CSV形式）
            // 列: 年,月,日,時(UTC),台風番号,台風名,階級,緯度,経度,中心気圧,
            //     最大風速(kt),50KT長径方向,50KT長径(nm),50KT短径(nm),
            //     30KT長径方向,30KT長径(nm),30KT短径(nm),上陸
            // ------------------------------------------------------------------
            function parseCsv(text) {
                var lines = text.split(/\r?\n/);
                var order = [];       // 台風番号の出現順
                var byNumber = {};    // 台風番号 -> {name, points:[]}

                for (var i = 1; i < lines.length; i++) { // 先頭行(ヘッダ)はスキップ
                    var line = lines[i].trim();
                    if (!line) continue;
                    var cols = line.split(',');
                    if (cols.length < 18) continue;

                    var p = {
                        year: parseInt(cols[0], 10),
                        month: parseInt(cols[1], 10),
                        day: parseInt(cols[2], 10),
                        hour: parseInt(cols[3], 10),
                        name: cols[5],
                        grade: parseInt(cols[6], 10),
                        lat: parseFloat(cols[7]),
                        lon: parseFloat(cols[8]),
                        pressure: parseInt(cols[9], 10),
                        windKt: parseInt(cols[10], 10),
                        storm50Dir: parseInt(cols[11], 10),
                        storm50Long: parseInt(cols[12], 10),
                        storm50Short: parseInt(cols[13], 10),
                        gale30Dir: parseInt(cols[14], 10),
                        gale30Long: parseInt(cols[15], 10),
                        gale30Short: parseInt(cols[16], 10),
                        landfall: parseInt(cols[17], 10) === 1
                    };
                    if (isNaN(p.lat) || isNaN(p.lon)) continue;

                    var tcNumber = cols[4];
                    if (!byNumber[tcNumber]) {
                        byNumber[tcNumber] = { number: tcNumber, name: p.name, points: [] };
                        order.push(tcNumber);
                    }
                    byNumber[tcNumber].points.push(p);
                }

                return order.map(function (num) { return byNumber[num]; });
            }

            function displayNameFor(tcNumber) {
                var serial = tcNumber.length >= 2 ? tcNumber.slice(-2) : tcNumber;
                return parseInt(serial, 10) + '号';
            }

            // ------------------------------------------------------------------
            // 1つの台風の描画
            // ------------------------------------------------------------------
            function renderStorm(storm) {
                var group = L.layerGroup();
                var pts = storm.points;
                var latlngs = pts.map(function (p) { return [p.lat, p.lon]; });
                var displayName = displayNameFor(storm.number);
                var maxGrade = pts[0].grade;
                var maxGradeRank = intensityRank(pts[0].grade);
                var bounds = L.latLngBounds(latlngs);

                // 経路（階級ごとに色分けした線分）
                for (var i = 0; i < pts.length; i++) {
                    var g = pts[i].grade;
                    var gRank = intensityRank(g);
                    if (gRank > maxGradeRank) { maxGradeRank = gRank; maxGrade = g; }
                    var info = gradeInfo(g);

                    if (i > 0) {
                        L.polyline([latlngs[i - 1], latlngs[i]], {
                            color: info.color,
                            weight: info.weight,
                            dashArray: info.dash,
                            opacity: 0.85
                        }).addTo(group);

                        // 見た目には出さない「太い当たり判定線」を重ねて、
                        // 細い経路線のすぐ近くをクリックしても反応するようにする
                        var hitLine = L.polyline([latlngs[i - 1], latlngs[i]], {
                            weight: 16,
                            opacity: 0,
                            interactive: true
                        });
                        hitLine.bindPopup(popupHtml(displayName, storm.number, pts[i]));
                        hitLine.addTo(group);
                    }

                    var ptMarker = L.circleMarker(latlngs[i], {
                        radius: 3,
                        color: '#ffffff',
                        weight: 1,
                        fillColor: info.color,
                        fillOpacity: 1
                    });
                    ptMarker.bindPopup(popupHtml(displayName, storm.number, pts[i]));
                    ptMarker.addTo(group);

                    // 見た目には出さない大きめの当たり判定円（点のすぐ近くもクリックしやすくする）
                    var hitPoint = L.circleMarker(latlngs[i], {
                        radius: 12,
                        opacity: 0,
                        fillOpacity: 0,
                        interactive: true
                    });
                    hitPoint.bindPopup(popupHtml(displayName, storm.number, pts[i]));
                    hitPoint.addTo(group);

                    if (pts[i].landfall) {
                        var lf = L.circleMarker(latlngs[i], {
                            radius: 6,
                            color: '#ffffff',
                            weight: 1.5,
                            fillColor: '#c0392b',
                            fillOpacity: 0.95
                        });
                        lf.bindPopup(popupHtml(displayName, storm.number, pts[i]));
                        lf.bindTooltip('上陸', { permanent: false, direction: 'top', className: 'landfall-label' });
                        lf.addTo(group);
                    }
                }

                // 名前ラベル（起点付近に表示、クリックでその台風の範囲にズーム）
                var nameLatLng = latlngs[0];
                var nameMarker = L.circleMarker(nameLatLng, { radius: 0, opacity: 0, fillOpacity: 0 });
                nameMarker.bindTooltip(displayName, {
                    permanent: true,
                    direction: 'right',
                    offset: [4, 0],
                    className: 'typhoon-name-label'
                });
                nameMarker.addTo(group);
                nameMarker.on('add', function () {
                    var tooltipEl = nameMarker.getTooltip() && nameMarker.getTooltip()._container;
                    if (tooltipEl) {
                        tooltipEl.onclick = function () {
                            map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
                        };
                    }
                });

                return {
                    number: storm.number,
                    name: storm.name,
                    displayName: displayName,
                    provisional: !!storm.provisional,
                    group: group,
                    bounds: bounds,
                    maxGrade: maxGrade,
                    firstPoint: pts[0],
                    lastPoint: pts[pts.length - 1]
                };
            }

            // ------------------------------------------------------------------
            // 台風リストパネルの構築
            // ------------------------------------------------------------------
            var allVisible = true;

            function buildListPanel(stormRenders) {
                listBody.innerHTML = '';
                listTitle.textContent = '一覧';
                allVisible = true;
                toggleAllBtn.textContent = '全て非表示';

                stormRenders.forEach(function (sr) {
                    var row = document.createElement('div');
                    row.className = 'storm-row';

                    var checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = true;
                    checkbox.addEventListener('change', function () {
                        if (checkbox.checked) {
                            sr.group.addTo(typhoonRootGroup);
                        } else {
                            typhoonRootGroup.removeLayer(sr.group);
                        }
                    });
                    row.appendChild(checkbox);

                    var dot = document.createElement('span');
                    dot.className = 'storm-max-dot';
                    dot.style.background = gradeInfo(sr.maxGrade).color;
                    dot.title = '最大階級: ' + gradeInfo(sr.maxGrade).label + '（色は右下の凡例と対応）';
                    row.appendChild(dot);

                    var text = document.createElement('span');
                    text.className = 'storm-text';
                    var period = shortJST(sr.firstPoint.year, sr.firstPoint.month, sr.firstPoint.day, sr.firstPoint.hour) +
                        '〜' + shortJST(sr.lastPoint.year, sr.lastPoint.month, sr.lastPoint.day, sr.lastPoint.hour);
                    text.innerHTML = '<b>' + sr.displayName + '</b>' +
                        (sr.provisional ? ' <span style="color:#e67e22; font-size:10px;">(速報)</span>' : '') +
                        '<span class="storm-period">' + period + '</span>';
                    row.appendChild(text);

                    row.addEventListener('click', function (e) {
                        if (e.target === checkbox) return;
                        map.fitBounds(sr.bounds, { padding: [40, 40], maxZoom: 8 });
                    });

                    listBody.appendChild(row);
                });
            }

            toggleAllBtn.addEventListener('click', function () {
                var checkboxes = listBody.querySelectorAll('input[type="checkbox"]');
                allVisible = !allVisible;
                checkboxes.forEach(function (cb) {
                    if (cb.checked !== allVisible) {
                        cb.checked = allVisible;
                        cb.dispatchEvent(new Event('change'));
                    }
                });
                toggleAllBtn.textContent = allVisible ? '全て非表示' : '全て表示';
            });

            // ------------------------------------------------------------------
            // 年ごとのデータ取得・表示
            // ------------------------------------------------------------------
            var csvCache = {};
            var currentRequestYear = null;

            function clearMap() {
                typhoonRootGroup.clearLayers();
                listBody.innerHTML = '';
                listTitle.textContent = '一覧';
            }

            function renderYear(year, storms) {
                clearMap();

                if (!storms.length) {
                    statusEl.textContent = year + '年は台風位置表データがありません。';
                    return;
                }

                var stormRenders = storms.map(renderStorm);
                stormRenders.forEach(function (sr) { sr.group.addTo(typhoonRootGroup); });
                buildListPanel(stormRenders);

                var combined = null;
                stormRenders.forEach(function (sr) {
                    combined = combined ? combined.extend(sr.bounds) : L.latLngBounds(sr.bounds.getSouthWest(), sr.bounds.getNorthEast());
                });
                if (combined) {
                    map.fitBounds(combined, { padding: [30, 30] });
                }

                var provisionalCount = stormRenders.filter(function (sr) { return sr.provisional; }).length;
                var sourceLine = '出典: 気象庁 台風位置表（確定値）';
                if (provisionalCount > 0) {
                    sourceLine += ' ／ 直近' + provisionalCount + '件は<a href="https://agora.ex.nii.ac.jp/digital-typhoon/" target="_blank" rel="noopener">デジタル台風（国立情報学研究所）</a>の速報値（未確定・上陸/暴風域情報なし）';
                }
                statusEl.innerHTML = year + '年の台風経路を表示中（' + stormRenders.length + '件）' +
                    '<br><span style="font-size:10px; color:#888;">' + sourceLine + '</span>';
            }

            // ------------------------------------------------------------------
            // 「デジタル台風」（国立情報学研究所）の台風別GeoJSONで、
            // 気象庁の確定値CSVにまだ載っていない直近の台風（進行中・解析待ち）を補う。
            // 確定値CSV中の最大の台風番号の次の番号から順番に取得を試み、
            // 取得できなくなったところで打ち切る。
            // ------------------------------------------------------------------
            function fetchProvisionalStorms(year, baseStorms) {
                var maxSerial = 0;
                baseStorms.forEach(function (s) {
                    var serial = parseInt(String(s.number).slice(-2), 10);
                    if (!isNaN(serial) && serial > maxSerial) maxSerial = serial;
                });

                function fetchOne(serial) {
                    var pad = serial < 10 ? '0' + serial : String(serial);
                    var id = String(year) + pad;
                    var url = 'https://agora.ex.nii.ac.jp/digital-typhoon/geojson/wnp/' + id + '.ja.json';
                    return fetch(url)
                        .then(function (res) {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.json();
                        })
                        .then(function (geojson) {
                            if (!geojson.features || !geojson.features.length) throw new Error('no features');
                            var points = geojson.features.map(function (f) {
                                var t = new Date(f.properties.time * 1000);
                                return {
                                    year: t.getUTCFullYear(),
                                    month: t.getUTCMonth() + 1,
                                    day: t.getUTCDate(),
                                    hour: t.getUTCHours(),
                                    name: geojson.properties.name || '',
                                    grade: f.properties.class,
                                    lat: f.geometry.coordinates[1],
                                    lon: f.geometry.coordinates[0],
                                    pressure: f.properties.pressure || null,
                                    windKt: f.properties.wind || 0,
                                    storm50Dir: 0, storm50Long: 0, storm50Short: 0,
                                    gale30Dir: 0, gale30Long: 0, gale30Short: 0,
                                    landfall: false
                                };
                            });
                            return { number: id, name: geojson.properties.name || '', points: points, provisional: true };
                        });
                }

                var extra = [];
                var serial = maxSerial + 1;
                var misses = 0;
                var MAX_TRY = 20; // 安全のための上限試行回数

                function step() {
                    if (serial - maxSerial > MAX_TRY || misses >= 2) {
                        return Promise.resolve(extra);
                    }
                    var thisSerial = serial;
                    return fetchOne(thisSerial).then(function (storm) {
                        extra.push(storm);
                        misses = 0;
                        serial = thisSerial + 1;
                        return step();
                    }).catch(function () {
                        misses++;
                        serial = thisSerial + 1;
                        return step();
                    });
                }

                return step().catch(function () { return extra; });
            }

            function loadYear(year) {
                currentRequestYear = year;
                yearSelect.disabled = true;
                statusEl.textContent = year + '年のデータを読み込み中...';
                clearMap();

                function finish(storms) {
                    if (currentRequestYear !== year) return;
                    if (year === THIS_YEAR) {
                        statusEl.textContent = year + '年の最新台風を確認中...';
                        fetchProvisionalStorms(year, storms).then(function (extra) {
                            if (currentRequestYear !== year) return;
                            renderYear(year, storms.concat(extra));
                        }).catch(function () {
                            if (currentRequestYear !== year) return;
                            renderYear(year, storms);
                        }).finally(function () {
                            if (currentRequestYear === year) yearSelect.disabled = false;
                        });
                    } else {
                        renderYear(year, storms);
                        yearSelect.disabled = false;
                    }
                }

                if (csvCache[year]) {
                    finish(csvCache[year]);
                    return;
                }

                var url = 'https://www.data.jma.go.jp/typhoon/position_table/table' + year + '.csv';
                fetch(url)
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.text();
                    })
                    .then(function (text) {
                        var storms = parseCsv(text);
                        csvCache[year] = storms;
                        finish(storms);
                    })
                    .catch(function (err) {
                        console.error('台風位置表の取得に失敗:', err);
                        if (currentRequestYear !== year) return;
                        if (year === THIS_YEAR) {
                            // 確定値CSVが未整備でも、速報データだけで表示を試みる
                            fetchProvisionalStorms(year, []).then(function (extra) {
                                if (currentRequestYear !== year) return;
                                if (extra.length) {
                                    renderYear(year, extra);
                                } else {
                                    statusEl.textContent = year + '年のデータ取得に失敗しました。（気象庁サイトへのアクセスがブロックされている可能性があります）';
                                }
                            }).finally(function () {
                                if (currentRequestYear === year) yearSelect.disabled = false;
                            });
                        } else {
                            statusEl.textContent = year + '年のデータ取得に失敗しました。（気象庁サイトへのアクセスがブロックされている可能性があります）';
                            yearSelect.disabled = false;
                        }
                    });
            }

            yearSelect.addEventListener('change', function () {
                loadYear(parseInt(yearSelect.value, 10));
            });

            // 初期表示：当年
            yearSelect.value = String(THIS_YEAR);
            loadYear(THIS_YEAR);
        });
    </script>
</body>
</html>
