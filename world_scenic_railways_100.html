function makeMarker(r) {
  const [no,name,country,region,lat,lng,type,desc] = r;
  const icon = L.divIcon({
    className:"",
    html:`<div style="width:22px;height:22px;border-radius:50%;background:${colors[region]};border:2px solid white;box-shadow:0 1px 4px #555;color:white;text-align:center;line-height:22px;font-size:10px;font-weight:bold">${no}</div>`,
    iconSize:[26,26], iconAnchor:[13,13]
  });
  const marker = L.marker([lat,lng], {icon});
  marker.bindPopup(`
    <div style="min-width:220px">
      <b>${no}. ${name}</b><br>
      ${country}<br>
      <small>${type}</small>
      <hr style="margin:6px 0">
      ${desc}
    </div>
  `);
  marker._data = r;
  return marker;
}

railways.forEach(r => markers.push(makeMarker(r)));

function update() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const region = document.getElementById("region").value;
  const type = document.getElementById("type").value;
  layer.clearLayers();

  let visible = [];
  markers.forEach(m => {
    const r = m._data;
    const text = r.join(" ").toLowerCase();
    const okSearch = !q || text.includes(q);
    const okRegion = region === "all" || r[3] === region;
    const okType = type === "all" || r[6] === type;
    if (okSearch && okRegion && okType) {
      layer.addLayer(m);
      visible.push(r);
    }
  });
  document.getElementById("count").textContent = `表示：${visible.length} / 100路線`;
}

document.getElementById("search").addEventListener("input", update);
document.getElementById("region").addEventListener("change", update);
document.getElementById("type").addEventListener("change", update);
update();
</script>
</body>
</html>
