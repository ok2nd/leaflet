#panel {

.region-link { white-space: nowrap; }
.legend a { color:#0645ad; text-decoration:none; cursor:pointer; display:block; padding: 1px 0; }
.legend a .legend-text { text-decoration:underline; }
.legend a:hover { color:#d00; }
.station-label { font-size:11px; background:white; border:1px solid #777; border-radius:3px; padding:1px 3px; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.25); }
@media(max-width:600px){
  #panel { width: max-content; max-width: calc(100vw - 20px); }
  #panel h2 { font-size:16px; }
}
.railway-label {

  border-radius:3px; padding:1px 4px; font-size:11px; line-height:16px; color:#222;

function fetchStations(r, geo) {
  const data = EMBEDDED_STATIONS[String(r[0])] || [];
  return Promise.resolve(data.map(x => ({
    name:x[0],
    lat:x[1],
    lng:x[2],
    tags:{
      railway:"station",
      "name:en":"",
      embedded:"yes"
    }
  })));
}
function dedupeStations(stations) {
  const seen = new Set();
  return stations.filter(st => {
    const key = `${st.name}|${st.lat.toFixed(5)}|${st.lng.toFixed(5)}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

async function fetchRailwayWikipedia(r) {
  const exactUrls = {
    "フロム鉄道／Flåmsbana": "https://ja.wikipedia.org/wiki/フロム線"
  };
  if (exactUrls[r[1]]) return exactUrls[r[1]];

  const names = getSearchNames(r[1]);
  for (const q of [...new Set(names)]) {
    try {
      const api = "https://ja.wikipedia.org/w/api.php?action=query&list=search"
        + "&srsearch=" + encodeURIComponent(q)
        + "&srlimit=3&format=json&origin=*";
      const res = await fetch(api);
      if (!res.ok) continue;
      const data = await res.json();
      const hit = (data.query?.search || [])[0];
      if (hit) return "https://ja.wikipedia.org/wiki/" + encodeURIComponent(hit.title.replace(/ /g,"_"));
    } catch(e) { console.warn("Wikipedia lookup failed:", q, e); }
  }
  return null;
}

async function fetchCommonsPhoto(r) {
  const names = getSearchNames(r[1]);
  const search = names[0] + " railway";
  const api = "https://commons.wikimedia.org/w/api.php?action=query&generator=search"
    + "&gsrsearch=" + encodeURIComponent(search)
    + "&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url"
    + "&iiurlwidth=420&format=json&origin=*";
  try {
    const res = await fetch(api);
    if (!res.ok) throw new Error("Commons HTTP " + res.status);
    const data = await res.json();
    const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
    const page = pages.find(x => x.imageinfo && x.imageinfo[0] && x.imageinfo[0].thumburl)
              || pages.find(x => x.imageinfo && x.imageinfo[0] && x.imageinfo[0].url);
    if (!page) return null;
    return {
      url: page.imageinfo[0].thumburl || page.imageinfo[0].url,
      title: page.title
    };
  } catch(e) {
    console.warn("Commons photo lookup failed:", r[1], e);
    return null;
  }
}

let openRailwaySerial = 0;

function stationInfoPopup(r, st, clickLatLng) {
  const t = st.tags || {};
  const esc = v => escapeHtml(String(v));
  const rows = [];
  if (t.operator) rows.push(`<tr><th>運営会社</th><td>${esc(t.operator)}</td></tr>`);
  if (t.railway) rows.push(`<tr><th>駅種別</th><td>${esc(t.railway)}</td></tr>`);
  if (t.public_transport) rows.push(`<tr><th>公共交通</th><td>${esc(t.public_transport)}</td></tr>`);
  if (t.opening_date) rows.push(`<tr><th>開業</th><td>${esc(t.opening_date)}</td></tr>`);
  if (t.network) rows.push(`<tr><th>ネットワーク</th><td>${esc(t.network)}</td></tr>`);
  if (t.ref) rows.push(`<tr><th>駅番号</th><td>${esc(t.ref)}</td></tr>`);
  if (t.alt_name) rows.push(`<tr><th>別名</th><td>${esc(t.alt_name)}</td></tr>`);
  if (t['name:en']) rows.push(`<tr><th>英語名</th><td>${esc(t['name:en'])}</td></tr>`);
  if (t['name:fr']) rows.push(`<tr><th>仏語名</th><td>${esc(t['name:fr'])}</td></tr>`);
  if (t.website) rows.push(`<tr><th>Web</th><td><a href="${esc(t.website)}" target="_blank" rel="noopener">公式サイト</a></td></tr>`);
  if (t.wikipedia) rows.push(`<tr><th>Wikipedia</th><td>${esc(t.wikipedia)}</td></tr>`);

  const [no,name,country] = r;
  const html = `<div class="station-popup" style="min-width:250px;max-width:360px">
    <b>🚉 ${esc(st.name)}</b><br>
    <small>${esc(country)} ／ ${esc(name)}</small>
    ${rows.length ? `<hr style="margin:7px 0"><table style="font-size:12px;border-collapse:collapse;width:100%">${rows.join('')}</table>` : `<hr style="margin:7px 0"><small>OpenStreetMapに登録された駅情報は限られています。</small>`}
    <div style="margin-top:7px;font-size:11px;color:#666">駅の位置：${st.lat.toFixed(5)}, ${st.lng.toFixed(5)}</div>
    <div style="margin-top:7px"><a href="#" class="back-to-rail" data-no="${esc(no)}">← 鉄道の詳細に戻る</a></div>
  </div>`;

  if (activeRailPopup) map.closePopup(activeRailPopup);
  activeRailPopup = L.popup({closeButton:true, autoPan:false, closeOnClick:false, maxWidth:420})
    .setLatLng(clickLatLng || [st.lat,st.lng]).setContent(html).openOn(map);

  const back = activeRailPopup.getElement()?.querySelector('.back-to-rail');
  if (back) back.addEventListener('click', e => {
    e.preventDefault();
    openRailway(r, null, clickLatLng || [st.lat,st.lng]);
  });
}

async function openRailway(r, marker, clickLatLng) {
  const [no,name,country,region,lat,lng,type,desc] = r;
  const popupLatLng = clickLatLng || [lat,lng];
  const popupContent = `
    <div class="rail-popup" style="min-width:250px">
      <b>${escapeHtml(no)}. ${escapeHtml(name)}</b><br>
      ${escapeHtml(country)}<br>
      <small>${escapeHtml(type)}</small>
      <hr style="margin:6px 0">
      ${escapeHtml(desc)}
      <div id="rail-status-${no}" style="margin-top:8px">🚉 内蔵駅データを表示中…</div>
      <div id="rail-wiki-${no}" style="margin-top:8px"></div>
      <div id="rail-photo-${no}" style="margin-top:8px"></div>
    </div>`;

  // Markerを何度クリックしても、同じ路線の詳細を必ず再表示する。
  if (activeRailPopup) map.closePopup(activeRailPopup);
  activeRailPopup = L.popup({closeButton:true, autoPan:false, closeOnClick:false, maxWidth:450})
    .setLatLng(popupLatLng)
    .setContent(popupContent)
    .openOn(map);

  // 既に表示済みなら、路線図・駅を残したまま詳細だけ再表示。
  if (displayedRouteLayers.has(no)) {
    const existing = displayedRouteLayers.get(no);
    const status = document.getElementById(`rail-status-${no}`);
    if (status) {
      status.innerHTML = existing.routeDone
        ? `🚆 鉄道路線を表示中<br>🚉 駅 ${existing.stationCount}件を表示`
        : `🚉 駅 ${existing.stationCount}件を表示中<br>🚆 鉄道路線を表示中…`;
    }
    updatePhoto(r);
    updateWikipedia(r);
    return;
  }

  // ここが重要：駅はOverpassの路線取得を待たず、HTML内蔵データから即座に表示する。
  const group = L.featureGroup().addTo(routeLayers);
  const stations = await fetchStations(r, null);
  stations.forEach(st => {
    // 透明な14pxのヒット領域。白丸そのものより大幅に選択しやすい。
    const stationHit = L.circleMarker([st.lat, st.lng], {
      radius:14, weight:0, opacity:0, fillOpacity:0, interactive:true
    }).addTo(group);
    stationHit.bindTooltip(escapeHtml(st.name), {
      direction:"top", offset:[0,-10], sticky:true, opacity:.95
    });
    stationHit.on("click", function(e) {
      L.DomEvent.stopPropagation(e);
      stationInfoPopup(r, st, e.latlng);
    });

    // 見た目の白丸。
    L.circleMarker([st.lat, st.lng], {
      radius:4, weight:2, color:"#333", fillColor:"#fff", fillOpacity:1,
      interactive:false
    }).addTo(group);
  });

  const layerInfo = {group, stationCount:stations.length, routeDone:false};
  displayedRouteLayers.set(no, layerInfo);

  let status = document.getElementById(`rail-status-${no}`);
  if (status) {
    status.innerHTML = `🚉 駅 ${stations.length}件を表示中<br>🚆 鉄道路線を表示中…`;
  }

  // 写真・Wikipediaは路線取得とは独立して処理する。
  updatePhoto(r);
  updateWikipedia(r);

  // 路線図もHTML内蔵データだけで表示する。外部APIには接続しない。
  const geo = await fetchRouteGeometry(r);
  if (geo.lines.length) {
    geo.lines.forEach(line => {
      const hitLine = L.polyline(line, {
        color: colors[region], weight:22, opacity:0, interactive:true
      }).addTo(group);
      hitLine.on("click", function(e) {
        L.DomEvent.stopPropagation(e);
        openRailway(r, marker, e.latlng);
      });
      L.polyline(line, {
        color: colors[region], weight:5, opacity:.9,
        lineCap:"round", lineJoin:"round", interactive:false
      }).addTo(group);
    });
    layerInfo.routeDone = true;
    if (status) status.innerHTML = `🚆 内蔵の鉄道路線を表示中<br>🚉 駅 ${stations.length}件を表示`;
  } else {
    layerInfo.routeDone = true;
    if (status) status.innerHTML = `⚠ 内蔵鉄道路線データがありません<br>🚉 駅 ${stations.length}件を表示`;
  }
}

async function updateWikipedia(r) {
  const no = r[0];
  const box = document.getElementById(`rail-wiki-${no}`);
  if (!box) return;
  try {
    const url = await fetchRailwayWikipedia(r);
    if (url) box.innerHTML = `<a href="${url}" target="_blank" rel="noopener">Wikipediaで詳しく見る</a>`;
    else box.innerHTML = `<small>Wikipediaの記事が見つかりませんでした。</small>`;
  } catch(e) {}
}

async function updatePhoto(r) {
  const [no,name] = r;
  try {
    const photo = await fetchCommonsPhoto(r);
    const photoBox = document.getElementById(`rail-photo-${no}`);
    if (photoBox && photo) {
      photoBox.innerHTML =
        `<img src="${photo.url}" alt="${escapeHtml(name)}" style="display:block;width:100%;max-width:420px;height:auto;border-radius:5px">` +
        `<div style="font-size:10px;margin-top:3px;color:#666">写真：Wikimedia Commons / ${escapeHtml(photo.title)}</div>`;
    } else if (photoBox) {
      photoBox.innerHTML = `<small>代表写真が見つかりませんでした。</small>`;
    }
  } catch(e) {}
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function drawEmbeddedRailway(r) {
  const [no,name,country,region] = r;
  if (displayedRouteLayers.has(no)) return;
  const group = L.featureGroup().addTo(embeddedAllLayer);
  const stations = (EMBEDDED_STATIONS[String(no)] || []).map(x => ({name:x[0],lat:x[1],lng:x[2],tags:{railway:"station",embedded:"yes"}}));
  stations.forEach(st => {
    const hit=L.circleMarker([st.lat,st.lng],{radius:14,weight:0,opacity:0,fillOpacity:0,interactive:true}).addTo(group);
    hit.bindTooltip(escapeHtml(st.name),{direction:"top",offset:[0,-10],sticky:true,opacity:.95});
    hit.on("click",e=>{L.DomEvent.stopPropagation(e);stationInfoPopup(r,st,e.latlng);});
    L.circleMarker([st.lat,st.lng],{radius:4,weight:2,color:"#333",fillColor:"#fff",fillOpacity:1,interactive:false}).addTo(group);
  });
  const pts=EMBEDDED_ROUTES[String(no)]||[];
  if(pts.length>=2){
    const hit=L.polyline(pts,{color:colors[region],weight:22,opacity:0,interactive:true}).addTo(group);
    hit.on("click",e=>{L.DomEvent.stopPropagation(e);openRailway(r,null,e.latlng);});
    L.polyline(pts,{color:colors[region],weight:5,opacity:.9,lineCap:"round",lineJoin:"round",interactive:false}).addTo(group);
  }
  displayedRouteLayers.set(no,{group,stationCount:stations.length,routeDone:pts.length>=2});
}
function drawAllEmbeddedRailways(){railways.forEach(drawEmbeddedRailway);}

function makeMarker(r) {
  const [no,name,country,region,lat,lng,type,desc] = r;
  const icon = L.divIcon({
    className:"",
    html:`<div style="display:flex;align-items:center;gap:4px;white-space:nowrap">
      <div style="flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:${colors[region]};border:2px solid white;box-shadow:0 1px 4px #555;color:white;text-align:center;line-height:22px;font-size:10px;font-weight:bold">${no}</div>
      <div class="railway-label">${escapeHtml(name)}</div>
    </div>`,
    iconSize:[26,26], iconAnchor:[13,13]
  });
  const marker = L.marker([lat,lng], {icon, riseOnHover:true});
  marker._data = r;
  marker.on("click", function(e) {
    L.DomEvent.stopPropagation(e);
    openRailway(r, marker, e.latlng);
  });
  return marker;
}
function zoomToRegion(region) {
  if (region === "all") {
    map.fitBounds(L.latLngBounds(railways.map(r => [r[4], r[5]])), { padding:[25,25], maxZoom:3 });
    return;
  }
  const selected = railways.filter(r => r[3] === region);
  if (!selected.length) return;
  map.fitBounds(L.latLngBounds(selected.map(r => [r[4], r[5]])), { padding:[30,30], maxZoom:6 });
}

let selectedRegion = "all";

document.querySelectorAll(".region-link").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    selectedRegion = link.dataset.region;
    update();
    zoomToRegion(selectedRegion);
  });
});

function update() {
  layer.clearLayers();
  const visible = [];
  markers.forEach(m => {
    const r = m._data;
    const okRegion = selectedRegion === "all" || String(r[3]).trim() === selectedRegion;
    if (okRegion) { layer.addLayer(m); visible.push(r); }
  });
  document.getElementById("count").textContent = `表示：${visible.length} / 100路線`;
}

// 100路線のマーカーを生成
railways.forEach(r => markers.push(makeMarker(r)));

drawAllEmbeddedRailways();

update();
</script>
